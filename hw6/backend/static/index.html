<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный дом</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <header>
        <h1>🏠 Умный дом</h1>
        <button id="btn-report" onclick="getReport()">📋 Отчёт о доме</button>
    </header>

    <main>
        <!-- Rooms view -->
        <section id="rooms-view">
            <div class="section-header">
                <h2>Комнаты</h2>
                <button class="btn-add" onclick="showAddRoom()">+ Добавить комнату</button>
            </div>
            <div id="rooms-list" class="card-grid"></div>
        </section>

        <!-- Room detail view -->
        <section id="room-detail" class="hidden">
            <div class="section-header">
                <h2 id="room-title"></h2>
                <button class="btn-back" onclick="showRooms()">← Назад к комнатам</button>
            </div>
            <div class="section-subheader">
                <h3>Устройства</h3>
                <button class="btn-add" onclick="showAddDevice()">+ Добавить устройство</button>
            </div>
            <div id="devices-list" class="card-grid"></div>
        </section>

        <!-- Report view -->
        <section id="report-view" class="hidden">
            <div class="section-header">
                <h2>📋 Отчёт о доме</h2>
                <button class="btn-back" onclick="showRooms()">← Назад</button>
            </div>
            <pre id="report-content"></pre>
        </section>
    </main>

    <!-- Add Room Modal -->
    <div id="modal-add-room" class="modal hidden">
        <div class="modal-content">
            <h3>Добавить комнату</h3>
            <input type="text" id="room-name" placeholder="Название комнаты">
            <div class="modal-actions">
                <button onclick="addRoom()">Добавить</button>
                <button class="btn-cancel" onclick="hideModal('modal-add-room')">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Add Device Modal -->
    <div id="modal-add-device" class="modal hidden">
        <div class="modal-content">
            <h3>Добавить устройство</h3>
            <label>Ключ устройства</label>
            <input type="text" id="device-key" placeholder="Напр: tv_socket">
            <label>Тип устройства</label>
            <select id="device-type" onchange="toggleDeviceFields()">
                <option value="socket">Розетка</option>
                <option value="thermometer">Термометр</option>
            </select>
            <label>Имя устройства</label>
            <input type="text" id="device-name" placeholder="Напр: Телевизор">
            <div id="socket-fields">
                <label>Включена</label>
                <select id="device-is-on">
                    <option value="true">Да</option>
                    <option value="false">Нет</option>
                </select>
                <label>Мощность (Вт)</label>
                <input type="number" id="device-power" placeholder="150" step="0.1">
            </div>
            <div id="thermometer-fields" class="hidden">
                <label>Температура (°C)</label>
                <input type="number" id="device-temp" placeholder="22.5" step="0.1">
            </div>
            <div class="modal-actions">
                <button onclick="addDevice()">Добавить</button>
                <button class="btn-cancel" onclick="hideModal('modal-add-device')">Отмена</button>
            </div>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
