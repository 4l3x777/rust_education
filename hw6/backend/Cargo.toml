[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
smart_home = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
